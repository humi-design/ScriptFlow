{% extends "base.html" %}

{% block title %}Page Not Found - ScriptFlow{% endblock %}

{% block body %}
<div class="min-h-screen flex items-center justify-center p-6">
    <div class="text-center max-w-md">
        <div class="relative mb-8">
            <div class="absolute inset-0 blur-3xl opacity-30">
                <div class="w-48 h-48 mx-auto bg-gradient-to-r from-accent to-accent-end rounded-full"></div>
            </div>
            <div class="relative">
                <svg class="w-48 h-48 mx-auto" viewBox="0 0 100 100" fill="none">
                    <defs>
                        <linearGradient id="errorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#667eea"/>
                            <stop offset="100%" style="stop-color:#764ba2"/>
                        </linearGradient>
                    </defs>
                    <rect width="100" height="100" rx="22" fill="url(#errorGradient)"/>
                    <text x="50" y="62" text-anchor="middle" fill="white" font-size="40" font-weight="bold">404</text>
                </svg>
            </div>
        </div>
        
        <h1 class="text-4xl font-bold mb-4">Page Not Found</h1>
        <p class="text-text-secondary mb-8">
            The page you're looking for doesn't exist or has been moved.
        </p>
        
        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <a href="/" class="px-6 py-3 bg-gradient-to-r from-accent to-accent-end text-white font-medium rounded-xl hover:opacity-90 transition-opacity">
                Go Home
            </a>
            <a href="javascript:history.back()" class="px-6 py-3 border border-border rounded-xl hover:bg-card transition-colors">
                Go Back
            </a>
        </div>
    </div>
</div>
{% endblock %}
