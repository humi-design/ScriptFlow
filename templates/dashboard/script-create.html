{% extends "dashboard/base.html" %}

{% block title %}New Script - ScriptFlow{% endblock %}

{% block dashboard_content %}
<div class="max-w-4xl mx-auto">
    <!-- Header -->
    <div class="flex items-center justify-between mb-8">
        <div>
            <a href="{{ url_for('dashboard.scripts') }}" class="inline-flex items-center text-text-secondary hover:text-white transition-colors mb-2">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
                Back to scripts
            </a>
            <h1 class="text-3xl font-bold">New Script</h1>
        </div>
    </div>
    
    <!-- Form -->
    <form id="script-form" method="POST" action="{{ url_for('dashboard.create_script') }}" class="space-y-6">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div>
            <label class="block text-sm font-medium mb-2">Script Title</label>
            <input type="text" name="title" id="title" required
                   class="w-full px-4 py-3 rounded-xl bg-card border border-border focus:border-accent focus:outline-none transition-colors text-lg"
                   placeholder="My Awesome Script" autofocus>
        </div>
        
        <div>
            <label class="block text-sm font-medium mb-2">Script Content</label>
            <textarea name="content" id="content" rows="20"
                      class="w-full px-4 py-3 rounded-xl bg-card border border-border focus:border-accent focus:outline-none transition-colors resize-none font-mono"
                      placeholder="Paste or type your script here..."></textarea>
            <div class="flex items-center justify-between mt-2 text-sm text-text-secondary">
                <span id="word-count">0 words</span>
                <span id="read-time">0 min read</span>
            </div>
        </div>
        
        <div class="flex items-center justify-end space-x-4 pt-4">
            <a href="{{ url_for('dashboard.scripts') }}" class="px-6 py-3 border border-border rounded-xl hover:bg-card transition-colors">
                Cancel
            </a>
            <button type="submit" class="px-8 py-3 bg-gradient-to-r from-accent to-accent-end text-white font-medium rounded-xl hover:opacity-90 transition-opacity">
                Create Script
            </button>
        </div>
    </form>
</div>
{% endblock %}

{% block extra_scripts %}
{{ super() }}
<script>
    const content = document.getElementById('content');
    const wordCount = document.getElementById('word-count');
    const readTime = document.getElementById('read-time');
    
    function updateMetrics() {
        const text = content.value || '';
        const words = text.trim().split(/\s+/).filter(w => w.length > 0).length;
        const minutes = Math.max(1, Math.round(words / 150));
        
        wordCount.textContent = `${words.toLocaleString()} words`;
        readTime.textContent = `${minutes} min read`;
    }
    
    content?.addEventListener('input', updateMetrics);
    
    // Auto-focus on title if empty
    if (!document.getElementById('title').value) {
        document.getElementById('title').focus();
    }
</script>
{% endblock %}
